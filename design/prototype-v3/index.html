<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>RxPlayer · 原型 03 · 待审核</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="colors.css">
  <link rel="stylesheet" href="prototype.css?revision=track-feedback">
  <link rel="stylesheet" href="transport-options.css?revision=8">
  <script defer src="cover-palettes.js"></script>
  <script defer src="prototype.js?revision=approved-floating"></script>
</head>
<body>
  <header class="review-tools">
    <div class="review-title"><strong>RxPlayer</strong><span>原型 03</span><span class="review-badge">待审核</span></div>
    <div class="review-controls">
      <div class="device-picker" role="group" aria-label="预览平台">
        <button data-device-choice="android" aria-pressed="false">Android</button>
        <button data-device-choice="desktop" aria-pressed="true">Windows</button>
      </div>
      <label class="scene-picker">搜索场景<select id="scene-select"><option value="results">搜索结果</option><option value="idle">起始状态</option><option value="loading">搜索中</option><option value="empty">没有结果</option><option value="error">网络错误</option><option value="expired">登录失效</option></select></label>
      <label class="scene-picker">播放场景<select id="playback-select" aria-label="预览播放状态"><option value="paused">就绪 / 暂停</option><option value="playing">播放中</option><option value="preparing">准备音频</option><option value="buffering">缓冲中</option><option value="failed">播放失败</option><option value="unavailable">内容不可用</option><option value="expired">地址失效</option><option value="refreshing">重新获取地址</option><option value="ended">播放结束</option></select></label>
      <label class="scene-picker">歌词状态<select id="lyrics-layout-select" aria-label="预览歌词状态"><option value="auto">跟随曲目</option><option value="none">无歌词</option><option value="available">有歌词</option></select></label>
      <button id="review-player" class="review-button">查看播放页</button>
      <button id="review-complete" class="review-button" hidden>模拟等待成功</button>
      <button id="review-theme" class="review-button" aria-label="切换深浅主题"><span class="symbol" aria-hidden="true">light_mode</span></button>
      <button id="review-reset" class="review-button">重置</button>
    </div>
  </header>
  <main class="review-stage">
    <section id="product" class="product" data-device="desktop" data-theme="dark" aria-label="RxPlayer 产品原型 03">
      <div class="window-chrome"><span class="symbol" aria-hidden="true">graphic_eq</span><span>RxPlayer</span><span class="window-actions" aria-hidden="true">―　□　×</span></div>
      <div class="phone-status" aria-hidden="true"><span>9:41</span><span><i class="symbol">signal_cellular_alt</i><i class="symbol">wifi</i><i class="symbol">battery_full</i></span></div>
      <div class="workspace">
        <nav id="rail" class="rail" aria-label="主导航"></nav>
        <section id="main-pane" class="main-pane" aria-label="主内容"></section>
      </div>
      <footer id="transport" class="transport" aria-label="播放控制"></footer>
      <nav id="bottom-nav" class="bottom-nav" aria-label="主导航"></nav>
      <div class="phone-gesture" aria-hidden="true"><span></span></div>
      <div id="overlay" class="overlay" hidden>
        <button class="scrim" data-action="close-overlay" aria-label="关闭弹层"></button>
        <section id="dialog" class="sheet" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></section>
      </div>
      <button id="queue-scrim" class="queue-scrim" data-action="close-queue" aria-label="关闭播放队列" hidden></button>
      <aside id="support-pane" class="support-pane" aria-labelledby="queue-title" hidden></aside>
      <div id="snackbar" class="snackbar" role="status" hidden></div>
      <p id="live-feedback" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
  </main>
  <footer class="review-caption"><span>原型 03 · 状态补齐待审核 · 全部模拟，无真实音频；场景切换停留供审核，“模拟等待成功”可继续演示</span><span><a href="../prototype-v2/?view=player">原型 02</a> / <a href="../prototype-v1/">原型 01</a></span></footer>
</body>
</html>
