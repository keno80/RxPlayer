<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RxPlayer · Windows 播控栏方案</title><link rel="icon" href="data:,"><style>
@font-face{font-family:Rx;src:url(../prototype-v1/assets/roboto-flex.ttf)}
*{box-sizing:border-box}body{margin:0;background:#e4ebe7;color:#20332e;font:14px/1.5 Rx,'Microsoft YaHei',sans-serif}header{padding:18px 24px 14px;max-width:1600px;margin:auto}.heading{display:flex;gap:16px;align-items:center;justify-content:space-between}h1{font-size:20px;letter-spacing:-.5px;margin:0}.hint{color:#52675e;font-size:12px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}button{font:inherit;cursor:pointer;border:0;color:inherit}nav button{text-align:left;padding:10px 16px;min-height:64px;border-radius:20px;background:#d3ded8}nav button[aria-pressed=true]{background:#244d43;color:#effaf5}b{display:block;font-size:15px}small{display:block;margin-top:2px;opacity:.8}button:focus-visible{outline:3px solid #426d60;outline-offset:3px}.tools{display:flex;align-items:center;gap:8px}.tools button{background:#f5faf6;border-radius:24px;padding:0 16px;min-height:48px}main{max-width:1600px;margin:auto;padding:0 24px}iframe{display:block;width:100%;height:calc(100vh - 208px);min-height:520px;border:1px solid #a8bab1;border-radius:20px;background:#0c1512;box-shadow:0 12px 36px #17372a18}footer{padding:10px 24px 16px;max-width:1600px;margin:auto;font-size:12px;color:#52675e}a{color:inherit;text-underline-offset:3px}@media(max-width:850px){header{padding:12px}main{padding:0 12px}nav{gap:6px}nav button{padding:8px 10px}nav small{font-size:11px}.hint{display:none}iframe{height:640px}h1{font-size:17px}}
</style></head><body><header><div class="heading"><h1>RxPlayer <span style="font-weight:400">/ Windows 播控栏</span></h1><div class="tools"><span class="hint">三版仅供审核 · 正式应用尚未改动</span><button id="theme" aria-label="切换深浅主题">切换浅色</button></div></div><nav aria-label="播控栏设计方案"><button data-option="a" aria-pressed="true"><b>A · 单行横向 <span style="font-weight:400">推荐</span></b><small>80 px · 操作与进度同排，内容空间最多</small></button><button data-option="b" aria-pressed="false"><b>B · 居中双层</b><small>112 px · 恢复留白，主控居中、进度独立</small></button><button data-option="c" aria-pressed="false"><b>C · 分组浮岛</b><small>88 px · 曲目、主控、辅助操作分组</small></button></nav></header><main><iframe id="preview" title="可交互 Windows 原型" src="./?device=desktop&transport=a&embed=1&playback=paused"></iframe></main><footer id="note">A · 所有常用操作保持可见；点击封面展开播放页，队列沿用唯一面板。全部为模拟数据，无真实音频。</footer><script>
let choice='a',theme='dark';const frame=document.querySelector('iframe');
const notes={a:'A · 所有常用操作保持可见；点击封面展开播放页，队列沿用唯一面板。',b:'B · 恢复上下留白和按钮间距，保留居中操作层级，避免为了压缩高度而拥挤。',c:'C · 将关联控件收进同一容器；以主播放按钮的颜色和形状建立重点。'};
function update(){frame.src=`./?device=desktop&transport=${choice}&embed=1&theme=${theme}&playback=paused`;document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.option===choice)));document.querySelector('#note').textContent=notes[choice]+' 全部为模拟数据，无真实音频。';history.replaceState(null,'',`?option=${choice}&theme=${theme}`)}
document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{choice=b.dataset.option;update()});document.querySelector('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.querySelector('#theme').textContent=theme==='dark'?'切换浅色':'切换深色';update()};const q=new URLSearchParams(location.search);if(['a','b','c'].includes(q.get('option')))choice=q.get('option');update();
</script></body></html>
